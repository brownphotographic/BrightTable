name: Arch PKGBUILD

# Turns the packaging/arch/PKGBUILD template (pkgver=0, sha256sums=SKIP) into
# a real, checksummed PKGBUILD for each published GitHub release, and attaches
# it plus .SRCINFO to that release. Nothing gets committed back to the repo -
# that's the point: the release tarball's checksum can't exist until the tag
# does, so it's computed here instead of in a second post-tag commit.
#
# Release tags must be "vX.Y.Z" (the PKGBUILD's source= fetches tag
# "v$pkgver"); the tag-check step below fails closed on anything else.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)generate the PKGBUILD for, e.g. v1.4.0"
        required: true
      test_build:
        description: "Also run a full makepkg build (~15 min) to catch a broken PKGBUILD"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  pkgbuild:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check tag format and that it matches Cargo.toml's version
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' isn't vX.Y.Z - the PKGBUILD's source= URL assumes that exact form."
            exit 1
          fi
          VERSION="${TAG#v}"
          CARGO_VERSION=$(grep -m1 '^version' app/src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $TAG doesn't match app/src-tauri/Cargo.toml version $CARGO_VERSION - was the bump committed before tagging?"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Fill pkgver into a copy of the template
        run: |
          mkdir out
          sed "s/^pkgver=0$/pkgver=$VERSION/" packaging/arch/PKGBUILD > out/PKGBUILD
          grep -q "^pkgver=$VERSION$" out/PKGBUILD

      # makepkg refuses to run as root, hence the throwaway "builder" user.
      # updpkgsums downloads the tag's tarball and swaps SKIP for its sha256.
      - name: Checksum, generate .SRCINFO (and optionally test-build) in Arch
        env:
          TEST_BUILD: ${{ inputs.test_build && '1' || '0' }}
        run: |
          docker run --rm -v "$PWD/out:/pkg" -e TEST_BUILD archlinux:base-devel bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed pacman-contrib >/dev/null
            useradd -m builder
            chown -R builder /pkg
            echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
            cd /pkg
            sudo -u builder updpkgsums
            sudo -u builder makepkg --printsrcinfo > .SRCINFO
            if [ "$TEST_BUILD" = 1 ]; then
              sudo -u builder makepkg -s --noconfirm
            fi
          '
          sudo chown -R "$(id -u):$(id -g)" out
          grep -q "^sha256sums=('[0-9a-f]\{64\}')$" out/PKGBUILD
          cat out/PKGBUILD

      - name: Attach PKGBUILD and .SRCINFO to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/PKGBUILD out/.SRCINFO --clobber

      # AUR publishing - disabled until an AUR account exists (registration
      # was closed as of 2026-09). To enable: create the account, add its SSH
      # private key as the AUR_SSH_PRIVATE_KEY repo secret, and uncomment.
      # Pinned by full commit SHA since this step holds a key with push
      # access to the AUR package.
      # - name: Publish brighttable to the AUR
      #   uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
      #   with:
      #     pkgname: brighttable
      #     pkgbuild: out/PKGBUILD

[package]
name = "app"
version = "1.0.3"
description = "A Tauri App"
authors = ["you"]
license = "GPL-3.0-or-later"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "process", "io-util"] }
url = "2"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2"
walkdir = "2.5.0"
blake3 = "1.8.5"
kamadak-exif = "0.6.1"
time = { version = "0.3.41", features = ["std"] }
mimalloc = "0.1"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
# Export to Folder's JPEG rendition resize/re-encode (export_queue.rs), and
# Print's page compositing (print.rs) - png/tiff cover ordinary non-RAW true
# originals that aren't JPEG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
# Flickr's OAuth 1.0a request signing (flickr.rs) - no maintained OAuth1/
# Flickr crate to lean on, so signing is hand-rolled HMAC-SHA1 over these.
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
tauri-plugin-stronghold = "2"
iota_stronghold = "2"
rand = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.12", default-features = false, features = ["tokio", "blocking-api"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
webkit2gtk = "2.0"

[dev-dependencies]
# test-util (paused/virtual clock) only - lets import::queue's idle-timeout
# tests exercise real multi-minute waits without actually waiting minutes of
# wall-clock time in the suite. Dev-only so it never reaches the release build.
tokio = { version = "1", features = ["test-util"] }

# Originally added because Stronghold's snapshot crypto measured at 60+
# seconds per open/commit in an unoptimized `cargo tauri dev` build - these
# opt-level overrides brought that down to ~40s, not the ~1s the surrounding
# code assumed, which turned out to mean this alone wasn't the real fix: the
# actual cause was Stronghold's file-level `age` work factor applying its
# default weak-password KDF stretch unconditionally, regardless of our
# already-strong machine-generated key - see
# `secure_store::use_low_encrypt_work_factor`, which fixes that directly and
# brings the whole thing under a second even unoptimized. Kept here anyway as
# a low-cost safety net for whatever other crypto work these dependencies
# still do (Stronghold's own internal vault-record encryption, sync/hashing
# primitives, etc.) - optimizing just these crypto-heavy dependencies keeps
# the rest of the app at normal debug-build speed (fast iteration, full debug
# info) regardless.
[profile.dev.package.iota_stronghold]
opt-level = 3
[profile.dev.package.stronghold_engine]
opt-level = 3
[profile.dev.package."iota-crypto"]
opt-level = 3
[profile.dev.package."rust-argon2"]
opt-level = 3
[profile.dev.package."curve25519-dalek"]
opt-level = 3
[profile.dev.package."curve25519-dalek-derive"]
opt-level = 3
[profile.dev.package."fiat-crypto"]
opt-level = 3
[profile.dev.package."x25519-dalek"]
opt-level = 3
[profile.dev.package."ed25519-zebra"]
opt-level = 3
[profile.dev.package."blake2b_simd"]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package."aes-gcm"]
opt-level = 3
[profile.dev.package."crypto-bigint"]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hkdf]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3

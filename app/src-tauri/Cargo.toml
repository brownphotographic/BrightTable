[package]
name = "app"
version = "1.0.1"
description = "A Tauri App"
authors = ["you"]
license = "GPL-3.0-or-later"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "process", "io-util"] }
url = "2"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2"
walkdir = "2.5.0"
blake3 = "1.8.5"
kamadak-exif = "0.6.1"
time = { version = "0.3.41", features = ["std"] }
mimalloc = "0.1"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
# Export to Folder's JPEG rendition resize/re-encode (export_queue.rs), and
# Print's page compositing (print.rs) - png/tiff cover ordinary non-RAW true
# originals that aren't JPEG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
# Flickr's OAuth 1.0a request signing (flickr.rs) - no maintained OAuth1/
# Flickr crate to lean on, so signing is hand-rolled HMAC-SHA1 over these.
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
tauri-plugin-stronghold = "2"
iota_stronghold = "2"
rand = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.12", default-features = false, features = ["tokio", "blocking-api"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
webkit2gtk = "2.0"

[dev-dependencies]
# test-util (paused/virtual clock) only - lets import::queue's idle-timeout
# tests exercise real multi-minute waits without actually waiting minutes of
# wall-clock time in the suite. Dev-only so it never reaches the release build.
tokio = { version = "1", features = ["test-util"] }

# Stronghold's snapshot crypto (Argon2 key derivation + the actual vault
# encryption, run unconditionally on every real commit even for our own
# high-entropy machine-generated key - see secure_store.rs's own doc comment)
# is brutal without codegen optimizations: measured directly via `cargo test`
# at 60+ seconds per commit in an unoptimized `cargo tauri dev` build, against
# the ~1s this crate's own docs promise for a release build. Worse, every
# credential save held the app-wide config `Mutex` for that whole stretch
# (fixed separately in commands.rs), stalling every other command that reads
# config - found live: this alone explained hours of "why does
# check_sidecar_metadata never resolve" symptoms during dev testing.
# Optimizing just these crypto-heavy dependencies keeps the rest of the app at
# normal debug-build speed (fast iteration, full debug info) while making this
# one hot path tolerable in dev builds too.
[profile.dev.package.iota_stronghold]
opt-level = 3
[profile.dev.package.stronghold_engine]
opt-level = 3
[profile.dev.package."iota-crypto"]
opt-level = 3
[profile.dev.package."rust-argon2"]
opt-level = 3
[profile.dev.package."curve25519-dalek"]
opt-level = 3
[profile.dev.package."curve25519-dalek-derive"]
opt-level = 3
[profile.dev.package."fiat-crypto"]
opt-level = 3
[profile.dev.package."x25519-dalek"]
opt-level = 3
[profile.dev.package."ed25519-zebra"]
opt-level = 3
[profile.dev.package."blake2b_simd"]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package."aes-gcm"]
opt-level = 3
[profile.dev.package."crypto-bigint"]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hkdf]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3

[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "process", "io-util"] }
url = "2"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2"
walkdir = "2.5.0"
blake3 = "1.8.5"
kamadak-exif = "0.6.1"
time = { version = "0.3.41", features = ["std"] }
mimalloc = "0.1"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
# Export to Folder's JPEG rendition resize/re-encode (export_queue.rs).
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Flickr's OAuth 1.0a request signing (flickr.rs) - no maintained OAuth1/
# Flickr crate to lean on, so signing is hand-rolled HMAC-SHA1 over these.
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.12", default-features = false, features = ["tokio", "blocking-api"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
webkit2gtk = "2.0"

[dev-dependencies]
# test-util (paused/virtual clock) only - lets import::queue's idle-timeout
# tests exercise real multi-minute waits without actually waiting minutes of
# wall-clock time in the suite. Dev-only so it never reaches the release build.
tokio = { version = "1", features = ["test-util"] }
